      separation of historical assessment from current runtime health.
    projectionType: signed_score
    normalizationProfileId: NORM-MK18-v1
    status: ACTIVE

  - id: MK19
    name: RPI value yield and horizon realization
    question: >-
      What verified persistent project value or assurance did RPI create
      relative to total search, token, compute, implementation, validation,
      human and expected-risk cost, measured over the declared value horizon?
    evidenceSources:
      - forecast lifetime value and realized value observed to date, kept distinct
      - non-monetized assurance gain; token efficiency; improvement yield
      - attribution confidence
      - search saturation and marginal expected value of the next experiment
    failurePatterns:
      - reporting forecast value as if it were realized
      - counting assurance gain as monetized return
      - ignoring search saturation and continuing past marginal value
      - attributing value to RPI without attribution confidence
    verdictImpact: >-
      Value yield never overrides a mandatory gate; a negative or unattributable
      yield over the declared horizon is evidence about the RPI process itself.
    projectionType: signed_score
    normalizationProfileId: NORM-MK19-v1
    status: ACTIVE
    grid:
      index: 100
