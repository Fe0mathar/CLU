  # ---------------------------------------------------------------------
  # Area J — Mandatory Preservation and Acceptance Gates (ACCEPTANCE_GATES)
  # A failed applicable gate blocks ACCEPTED_PROVEN regardless of movement
  # elsewhere.
  # ---------------------------------------------------------------------
  - id: MI12
    name: Evidence-plan and benchmark-synthesis validity
    question: >-
      Is the complete evidence plan appropriate to the improvement claim,
      independently validated, resistant to work reduction and gaming, and
      frozen before candidate results are interpreted?
    evidenceSources:
      - "instrumented authority: analytic or exact proof, quantitative benchmarks, constraint and conformance checks"
      - "empirical authority: capability, Master Benchmark and cross-platform outcomes, controlled human-perceptual evaluation"
      - claim-to-instrument traceability, author identity, calibration, representativeness, sensitivity, repeatability
      - observer-effect analysis, baseline/candidate symmetry, randomization and blinding where applicable
      - decision thresholds, freeze hash, invalidation conditions
    failurePatterns:
      - an evidence plan interpreted or amended after candidate results are known
      - an AI-generated benchmark admitted without the validation required of any other instrument
      - work reduction or metric substitution hidden inside the instrument
      - baseline and candidate measured asymmetrically
    verdictImpact: >-
      An invalid or unfrozen evidence plan makes the claim inadmissible;
      evidence quality gaps block acceptance until the instrument is validated.
    projectionType: signed_score
    normalizationProfileId: NORM-MI12-v1
    status: ACTIVE
    grid:
