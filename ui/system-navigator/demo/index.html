<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>CLUE · System Navigator</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif; }
    clue-system-navigator { width: 100vw; height: 100vh; }
    .connection-state {
      position: fixed;
      right: 28px;
      bottom: 22px;
      z-index: 50;
      padding: 7px 10px;
      pointer-events: none;
      color: #00a3e0;
      background: rgba(0, 0, 0, .72);
      border: 1px solid rgba(0, 163, 224, .35);
      font: 10px/1.2 ui-monospace, Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
    }
    .connection-state.offline { color: #ff5500; border-color: rgba(255,85,0,.55); }
  </style>
</head>
<body>
  <clue-system-navigator
    id="systemNavigator"
    project-name="Murugan"
    discovery-cinematics="on"
    audio="on">
  </clue-system-navigator>
  <div id="connectionState" class="connection-state">CONNECTING TO CLUE…</div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
